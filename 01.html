<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>3가지 프로젝트 아이템 제안</title>
<link rel="stylesheet" href="slide.css">
<style>
  .cover .canvas{justify-content:center;gap:0;}
  .cover .course{font-family:var(--mono);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
  .cover h1{margin:16px 0 0;font-size:62px;font-weight:800;letter-spacing:-0.045em;line-height:1.08;}
  .cover h1 span{color:#B4332C;}
  .cover .sub{margin:14px 0 0;font-size:17px;color:var(--ink2);}
  .cover .items{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:42px;padding-top:28px;border-top:1px solid var(--line);}
  .cover .it{display:flex;flex-direction:column;gap:6px;}
  .cover .it .n{font-family:var(--mono);font-size:11px;font-weight:600;color:#fff;background:var(--c);width:22px;height:22px;border-radius:3px;display:grid;place-items:center;}
  .cover .it h2{margin:2px 0 0;font-size:17px;font-weight:700;letter-spacing:-0.025em;}
  .cover .it p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.5;}
  .cover .meta{position:absolute;left:54px;right:54px;bottom:30px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted);}
</style>
</head>
<body data-index="1" data-total="24">
<div class="slide cover">
  <div class="canvas">
    <div class="course">소프트웨어 프로젝트 &nbsp;/&nbsp; 4주차 아이디어 제안</div>
    <h1>3가지 프로젝트<br><span>아이템 제안</span></h1>
    <p class="sub">서로 다른 영역에서, 각각 &ldquo;기존 해결책이 비워 둔 자리&rdquo;를 겨냥한 세 가지 제안</p>
    <div class="items">
      <div class="it" style="--c:#B4332C">
        <div class="n">1</div>
        <h2>오프라인 모바일 보드게임</h2>
        <p>인터넷 없이, 앱 설치 없이<br>한 자리에서 즐기는 보드게임</p>
      </div>
      <div class="it" style="--c:#2F5D50">
        <div class="n">2</div>
        <h2>창작 설정 검증 어시스턴트</h2>
        <p>기획자·작가를 위한<br>설정 모순 탐지와 실시간 정리</p>
      </div>
      <div class="it" style="--c:#1B4A8A">
        <div class="n">3</div>
        <h2>영상 기반 엘리베이터 오토패스</h2>
        <p>CCTV로 포화도를 판단해<br>헛정차를 건너뛰는 시스템</p>
      </div>
    </div>
  </div>
  <div class="meta"><span>2026. 09. 28</span><span>팀원 2인</span></div>
</div>
<script src="slide.js"></script>
</body>
</html>
